name: Cypress Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: amazon-qa-test-cypress/package-lock.json

      - name: Install dependencies
        working-directory: amazon-qa-test-cypress
        run: npm ci

      - name: Run Cypress tests (headless)
        uses: cypress-io/github-action@v6
        with:
          working-directory: amazon-qa-test-cypress
          install: false
          command: npm test

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            amazon-qa-test-cypress/cypress/screenshots
            amazon-qa-test-cypress/cypress/videos
            amazon-qa-test-cypress/cypress/reports
          retention-days: 7
