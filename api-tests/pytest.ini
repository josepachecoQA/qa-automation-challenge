[pytest]
addopts = -v --html=reports/report.html --self-contained-html --css=reports/estilo-relatorio.css
python_files = test_*.py
testpaths = tests
timeout = 15
render_collapsed = false
markers =
	smoke: cenários essenciais de validação rápida
	contrato: cenários de contrato, borda e regras da API
